[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clickhouse-universe-exporter"
version = "0.1.0"
description = "One-shot ClickHouse metadata exporter for ClickHouse Universe"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "antlr4-python3-runtime>=4.13,<4.14",
  "clickhouse-connect>=1.0,<2",
  "jsonschema>=4.23,<5"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.9,<1"]

[project.scripts]
clickhouse-universe-exporter = "clickhouse_universe_exporter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["src/clickhouse_universe_exporter/parsing/generated_ch_parser"]
